[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handnotes"
version = "0.1.0"
description = "Turn hand-tracking data (e.g. MediaPipe in TouchDesigner) into strings of music notes."
readme = "README.md"
license = { text = "MIT" }
# TouchDesigner ships its own Python (3.9-3.11 depending on build), so the core
# is pure stdlib and avoids newer syntax.
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
